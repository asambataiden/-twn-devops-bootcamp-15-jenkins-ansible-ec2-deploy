services:
  java-app:
    image: asambataiden/demo-app:java-maven-2.0
    environment:
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_SERVER=mysql
      - DB_NAME=my-app-db

    ports:
      - "8080:8080"
    container_name: my-java-app

  mysql:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=my-app-db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    container_name: my-mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=user
      - PMA_PASSWORD=password
    ports:
      - "8081:80"
    container_name: my-phpmyadmin

volumes:
  mysql-data: