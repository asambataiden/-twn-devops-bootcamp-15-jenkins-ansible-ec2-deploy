
---
plugin: amazon.aws.aws_ec2

regions:
  - eu-north-1

keyed_groups:
  - key: tags
    prefix: tag
  - key: tags.Role
    prefix: ec2_
    separator: ''
  - key: instance_type
    prefix: instance_type
  - key: tags.Environment
    prefix: env
    separator: ''

filters:
  instance-state-name: running
  tag:Name: ansible-server

hostnames:
  - dns-name

compose:
  ansible_host: public_ip_address
  ansible_user: "'ec2-user'"

groups:
  ec2_docker_server: >-
    ec2_tags.Role | default('') == 'docker-server'

use_deprecated_tags: false
