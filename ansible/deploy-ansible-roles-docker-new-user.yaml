---
- name: Configure Amazon Linux Docker hosts and deploy application
  hosts: ec2_docker_server
  become: true
  gather_facts: true
  vars_files:
    - ec2-docker-vars.yaml
    - secrets.vault.yml

  roles:
    - linux_baseline
    - docker_storage
    - docker_engine
    - linux_users
    - docker_compose
    - docker_registry
    - application_deploy
    - application_verify
